<!doctype html>
<!--
  Studio Engine host for HyperFrames components (snippets mounted with data-composition-src).
  Query: c=<composition id> src=<snippet path from hyperframes/> v=<variables json> d=<seconds> box=<x,y,w,h in %> theme=<tokens json> bg=<css color>
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="./hf-bridge.js"></script>
    <script src="./hyperframe.runtime.js"></script>
    <link rel="stylesheet" href="./__FONTS_CSS__" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root {
        --bg: #0b0c0e;
        --fg: #f5f3ee;
        --muted: #9aa3ad;
        --surface: #15181d;
        --border: #343a46;
        --brand: #ffc72c;
        --accent: #e8413b;
        --accent-2: #61a8ff;
        --font-display: Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, monospace;
        --radius: 3cqmin;
        --space-1: 1.2cqmin;
        --space-2: 2.4cqmin;
        --space-3: 4cqmin;
        --dur-beat: 0.4s;
        --ease-standard: cubic-bezier(0.215, 0.61, 0.355, 1);
        --ease-emphasis: cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--font-body);
        color: var(--fg);
      }
      .mount { position: absolute; container-type: size; overflow: hidden; }
    </style>
  </head>
  <body>
    <script src="./npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var name = q.get('c');
        var dur = q.get('d') || '5';
        var box = (q.get('box') || '0,0,100,100').split(',').map(Number);
        var root = document.createElement('div');
        root.id = 'root';
        root.setAttribute('data-composition-id', 'studio-host');
        root.setAttribute('data-start', '0');
        root.setAttribute('data-width', '1920');
        root.setAttribute('data-height', '1080');
        root.setAttribute('data-duration', dur);
        root.setAttribute('data-fps', '30');
        var theme = JSON.parse(q.get('theme') || '{}');
        Object.keys(theme).forEach(function (k) { root.style.setProperty(k.indexOf('--') === 0 ? k : '--' + k, theme[k]); });
        if (q.get('bg')) root.style.background = q.get('bg');
        var mount = document.createElement('div');
        mount.id = name + '-mount';
        mount.className = 'mount clip';
        mount.style.left = box[0] + '%';
        mount.style.top = box[1] + '%';
        mount.style.width = box[2] + '%';
        mount.style.height = box[3] + '%';
        mount.setAttribute('data-composition-id', name);
        mount.setAttribute('data-composition-src', './' + (q.get('src') || 'components/' + name + '/' + name + '.html'));
        mount.setAttribute('data-variable-values', q.get('v') || '{}');
        mount.setAttribute('data-start', '0');
        mount.setAttribute('data-duration', dur);
        mount.setAttribute('data-track-index', '0');
        mount.setAttribute('data-width', String(Math.round((1920 * box[2]) / 100)));
        mount.setAttribute('data-height', String(Math.round((1080 * box[3]) / 100)));
        root.appendChild(mount);
        document.body.appendChild(root);
        window.__timelines = window.__timelines || {};
        window.__timelines['studio-host'] = gsap.timeline({ paused: true });
      })();
    </script>
  </body>
</html>
